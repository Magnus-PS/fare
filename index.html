<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Fare Weekly Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: market-list app. Sticky header with three sequential steps; one working column of cards. */
:root{
  --bg:#f4f7f3; --surface:#ffffff; --ink:#17221b; --muted:#5a6a5f; --line:#dce4de;
  --accent:#1e6a44; --accent-ink:#ffffff; --accent-soft:#e2eee6;
  --org:#256f45; --org-bg:#e0f0e5; --c15:#24678f; --c15-bg:#e0edf6;
  --wild:#176a73; --wild-bg:#dbeff0; --past:#875811; --past-bg:#f5ead6;
  --warn:#9a4a12; --warn-bg:#fbe9dc;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#17201b; --ink:#e4ebe6; --muted:#9aaa9f; --line:#2a3630;
  --accent:#62c38d; --accent-ink:#0c1a12; --accent-soft:#1b2e23;
  --org:#80d2a1; --org-bg:#1a3224; --c15:#8fc3e4; --c15-bg:#172a37;
  --wild:#80d0d6; --wild-bg:#153134; --past:#e1b466; --past-bg:#342916;
  --warn:#f0a774; --warn-bg:#3a2316; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#17201b; --ink:#e4ebe6; --muted:#9aaa9f; --line:#2a3630;
  --accent:#62c38d; --accent-ink:#0c1a12; --accent-soft:#1b2e23;
  --org:#80d2a1; --org-bg:#1a3224; --c15:#8fc3e4; --c15-bg:#172a37;
  --wild:#80d0d6; --wild-bg:#153134; --past:#e1b466; --past-bg:#342916;
  --warn:#f0a774; --warn-bg:#3a2316; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font:700 24px/1 var(--display);letter-spacing:-.02em;color:var(--accent);margin:0}
.brand small{display:block;font:500 12px/1.3 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{font:600 14px var(--body);border:1px solid transparent;background:none;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;gap:7px;align-items:center}
nav button .n{font:500 12px var(--mono);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav button[aria-current="page"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted);padding-block:10px 0;margin:0}
main{padding-block:18px 96px;display:grid;gap:18px}
h2{font:700 26px/1.15 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font:600 16px/1.3 var(--body);margin:0}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.btn{font:600 14px var(--body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.label{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.field .hint{font-size:12px;color:var(--muted)}
input[type=number],select,textarea{font:15px var(--body);width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;user-select:none;background:var(--surface)}
label.chip input{position:absolute;opacity:0;pointer-events:none}
label.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tag{display:inline-block;font:500 12px/1.2 var(--body);padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.rule{display:inline-block;font:600 11.5px/1.2 var(--body);padding:3px 8px;border-radius:999px;white-space:nowrap}
.r-org{color:var(--org);background:var(--org-bg)} .r-c15{color:var(--c15);background:var(--c15-bg)}
.r-wild{color:var(--wild);background:var(--wild-bg)} .r-past{color:var(--past);background:var(--past-bg)}
.guides{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.guides li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.guides li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;margin-left:4px}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.macro{border-top:2px solid var(--line);padding-top:6px}
.macro b{display:block;font:500 20px var(--mono);font-variant-numeric:tabular-nums}
.macro span{font-size:12px;color:var(--muted)}
.meals{display:grid;gap:10px}
.meal{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.meal.liked{border-color:var(--accent)}
.day{font:700 15px/1 var(--display);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;padding-top:3px}
.day small{display:block;font:400 12px var(--mono);color:var(--muted);margin-top:4px;text-transform:none;letter-spacing:0}
.meal-body{min-width:0;display:grid;gap:6px}
.meal .why{margin:0;color:var(--ink)}
.meal .meta{font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meal .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.status{font:600 13px var(--body);padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.status.ok{background:var(--org-bg);color:var(--org)}
.learned{font-size:14px;color:var(--muted)}
.keeps{margin:0;font-size:14px;color:var(--muted)} .keeps b{color:var(--ink);font-weight:600}
.cookday h3{font:700 19px var(--display)}
.week{display:grid}
.night{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.night:last-child{border-bottom:0}
.night .dn{font-weight:600} .night .dn small{font:12px var(--mono);color:var(--muted);font-weight:400}
.night .what b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 12px var(--mono);margin-right:6px;padding:0 4px}
.tag.frz{color:var(--c15);background:var(--c15-bg);border-color:transparent}
.meal.flex{border-style:dashed}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.learned b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.summary div b{display:block;font:500 24px var(--mono);font-variant-numeric:tabular-nums}
.summary div span{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pick td{background:var(--accent-soft)}
.store{display:grid;gap:0}
.store-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.store-head h3{font:700 19px var(--display)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;min-width:0}
.item .qty{font:13px var(--mono);color:var(--muted);margin-left:6px;font-weight:400}
.item .wh{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cat{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:14px}
.fb-btn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fb{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:20;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:grid;gap:10px}
.fb ul{margin:0;padding-left:18px;max-height:140px;overflow:auto;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
@media (max-width:520px){
  nav{margin-left:0;width:100%} nav button{flex:1;justify-content:center;padding:7px 6px}
  .macros{grid-template-columns:repeat(2,minmax(0,1fr))}
  .meal{grid-template-columns:minmax(0,1fr);gap:6px} .day small{display:inline;margin-left:8px}
  .night{grid-template-columns:1fr auto} .night .what{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:no-preference){.meal{transition:border-color .2s}}
main>section,main>section>*{min-width:0}
section{display:grid;gap:18px}
.members{display:grid;gap:10px}
.member{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding-bottom:10px;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0;padding-bottom:0}
input[type=text]{font:15px var(--body);width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.assume{font-size:13.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.assume b{color:var(--ink)}
details.ing{min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
details.ing summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details.ing[open] summary{margin-bottom:8px}
.ingt td,.ingt th{padding:5px 6px}
.ingt input{padding:5px 7px;font-size:14px;min-width:0}
.ingt input[type=number]{width:72px;text-align:right;font-family:var(--mono)}
.ingt input.unit{width:80px}
.ingt td:first-child{min-width:150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:10px}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;max-width:calc(100vw - 32px)}
@media (max-width:620px){.member{grid-template-columns:1fr 1fr}.member .field:nth-child(2){grid-column:1/-1;grid-row:2}.member .rm{justify-self:start}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <p class="brand">Fare<small>Eat clean, buy simply, understand why</small></p>
      <nav aria-label="Steps">
        <button id="tab-profile" data-view="profile"><span class="n">1</span>Profile</button>
        <button id="tab-plan" data-view="plan"><span class="n">2</span>Plan</button>
        <button id="tab-list" data-view="list"><span class="n">3</span>List &amp; stores</button>
      </nav>
    </div>
  </div>
</header>

<div class="wrap">
  <p class="note">Prototype: sample household, mock recipes and illustrative prices. Nothing leaves this browser.</p>
  <main>
    <p class="learned" id="boot-msg">Loading…</p>
    <section id="view-profile" hidden></section>
    <section id="view-plan" hidden></section>
    <section id="view-list" hidden></section>
  </main>
</div>

<button class="btn primary fb-btn" id="fb-toggle" aria-expanded="false">Feedback</button>
<div id="toast" role="status" hidden></div>
<div class="fb" id="fb" hidden>
  <h3>What's working, what isn't?</h3>
  <textarea id="fb-text" rows="3" placeholder="e.g. I'd never cook shrimp on a Tuesday"></textarea>
  <div class="row"><button class="btn primary small" id="fb-save">Save note</button><button class="btn small" id="fb-copy">Copy all notes</button><span id="fb-msg" class="learned"></span></div>
  <ul id="fb-list"></ul>
  <p class="learned" style="margin:0">In the friends version these go straight to a feedback table along with the screen you were on.</p>
</div>

<script>
// Catalog and config load from data/*.json at boot (see boot() below)
let STORES,RULES,ING,RECIPES,BREAKFASTS,ATTR,COOK,STYLES,COMPONENTS,PORTIONS,GOALS,GOAL_TAGS,RESTR;
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const KEY='fare-poc-v3';
const DEFAULT={profile:{style:'batch',eat:'clean',customEx:[],dinners:5,breakfast:true,goals:['muscle','cheap'],restrictions:[],
  members:[{name:'Me',portion:1.67,weight:180},{name:'Partner',portion:1,weight:null},{name:'Daughter',portion:0.67,weight:null}]},
  plan:null,flex:'new',flexNew:null,approved:false,likes:[],dislikes:[],custom:{},shop:{stores:['tj','wf','costco','kroger'],loyal:'',stopValue:8},priceView:'meal',feedback:[],view:'plan'};
let S;
try{S=Object.assign(structuredClone(DEFAULT),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=structuredClone(DEFAULT)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+n.toFixed(2);
const R=id=>RECIPES.find(r=>r.id===id);
const num=n=>n>=10?String(Math.round(n)):String(Math.round(n*4)/4);
const portionsTxt=n=>(Math.round(n*10)/10).toString();

// Meal size: every member's portion adds up; one standard portion = 1.
const portions=()=>S.profile.members.reduce((s,m)=>s+(+m.portion||0),0)||1;
const isBatch=()=>S.profile.style==='batch';
const batchSize=()=>Math.max(4,Math.ceil(portions()*2));
const recipePortions=id=>isBatch()&&S.plan.includes(id)?batchSize():portions();

function banned(){const b=new Set();S.profile.restrictions.forEach(k=>{const r=RESTR.find(x=>x[0]===k);if(r)r[2].forEach(x=>b.add(x))});return b}
function styleOk(ingIds,carbs){
  const st=STYLES[S.profile.eat]||STYLES.clean;
  const ex=S.profile.eat==='custom'?S.profile.customEx:(st.ex||[]);
  if(ingIds.some(id=>(ATTR[id]||[]).some(t=>ex.includes(t))))return false;
  if(st.allow&&ingIds.some(id=>!(ATTR[id]||[]).some(t=>st.allow.includes(t))))return false;
  if(st.maxCarb&&carbs>st.maxCarb)return false;
  return true;
}
function allowed(r){const b=banned();return !r.contains.some(c=>b.has(c))&&styleOk(Object.keys(r.ing),r.c)}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%997;return h/997}
function score(r){
  let s=1;S.profile.goals.forEach(g=>Object.entries(GOAL_TAGS[g]).forEach(([t,w])=>{if(r.tags.includes(t))s+=w}));
  if(S.likes.includes(r.id))s+=1.5;
  return s+hash(r.id+S.profile.goals.join())*0.5;
}
const protein=r=>Object.keys(r.ing)[0];
function candidates(exclude,ok=()=>true){return RECIPES.filter(r=>ok(r)&&allowed(r)&&!S.dislikes.includes(r.id)&&!exclude.includes(r.id)).sort((a,b)=>score(b)-score(a))}
const planOk=r=>!isBatch()||r.batch;
const BATCH_NIGHTS=[0,1,2,0,1,2];
const FLEX={
  cheat:{label:'Cheat night',title:'Pizza or your favourite takeout',why:'One planned treat a week makes the other six nights easy to stick to.',cost:15},
  healthy:{label:'Healthy takeout',title:'Burrito-bowl style takeout (think Chipotle)',why:'Chicken or sofritas, brown rice, black beans, fajita veg, salsa and lettuce. Skip the chips and extra cheese.',cost:13},
  new:{label:'Cook something new',title:'',why:'',cost:0}
};
function freshPick(exclude){return candidates([...S.plan,...exclude],r=>!r.batch)[0]||candidates([...S.plan,...exclude])[0]}
// Deterministic stand-in for the LLM picker: rank by goal fit, avoid repeating a main protein.
function buildPlan(){
  const pick=[],used=new Set(),n=isBatch()?3:S.profile.dinners;
  for(const r of candidates([],planOk)){if(pick.length>=n)break;if(!used.has(protein(r))){pick.push(r.id);used.add(protein(r))}}
  for(const r of candidates(pick,planOk)){if(pick.length>=n)break;pick.push(r.id)}
  S.plan=pick;S.flexNew=isBatch()?(freshPick([])||{}).id||null:null;S.approved=false;save();
}
function swapFlex(dislike){
  const cur=S.flexNew;
  if(dislike&&cur&&!S.dislikes.includes(cur)){S.dislikes.push(cur);S.likes=S.likes.filter(x=>x!==cur)}
  const list=candidates(S.plan,r=>!r.batch).length?candidates(S.plan,r=>!r.batch):candidates(S.plan);
  const i=list.findIndex(r=>r.id===cur);
  const next=list.length?list[(i+1)%list.length]:null;
  S.flexNew=next?next.id:null;S.approved=false;save();render();
}
function swap(i,dislike){
  const cur=S.plan[i];
  if(dislike&&!S.dislikes.includes(cur)){S.dislikes.push(cur);S.likes=S.likes.filter(x=>x!==cur)}
  const used=new Set(S.plan.filter((_,j)=>j!==i).map(id=>protein(R(id))));
  const pool=candidates(S.plan,planOk);
  const next=pool.find(r=>!used.has(protein(r)))||pool[0];
  if(next){S.plan[i]=next.id}else if(dislike){S.plan.splice(i,1)}
  S.approved=false;save();render();
}
function breakfast(){const b=banned();return BREAKFASTS.find(x=>!x.contains.some(c=>b.has(c))&&styleOk(Object.keys(x.ing),x.c))||null}
const freshNight=()=>isBatch()&&S.flex==='new'&&S.flexNew;
const dinnerIds=()=>[...S.plan,...(freshNight()?[S.flexNew]:[])];

// Recipe rows: catalog ingredients (priced) plus anything the person added. Amounts stored per standard portion.
function rowsFor(id){
  if(S.custom[id])return S.custom[id];
  return Object.entries(R(id).ing).map(([k,q])=>({id:k,per:q,note:''}));
}
function rowView(row,n){
  if(row.id){const [a,u]=COOK[row.id];return {name:ING[row.id][0],amt:row.per*n*a,unit:u}}
  return {name:row.name,amt:row.per*n,unit:row.unit||''};
}
function setRow(id,i,field,val){
  const rows=structuredClone(rowsFor(id)),n=recipePortions(id),row=rows[i];
  if(field==='amt'){const v=Math.max(0,+val||0);row.per=row.id?v/(n*COOK[row.id][0]):v/n}
  else row[field]=val;
  S.custom[id]=rows;save();
}

function groceries(){
  const need={},extras=[],P=portions();
  dinnerIds().forEach(id=>{const n=recipePortions(id);rowsFor(id).forEach(row=>{
    if(row.id)need[row.id]=(need[row.id]||0)+row.per*n;
    else if(row.name)extras.push({name:row.name,amt:row.per*n,unit:row.unit||'',recipe:R(id).name});
  })});
  const bf=S.profile.breakfast?breakfast():null;
  if(bf)Object.entries(bf.ing).forEach(([k,q])=>need[k]=(need[k]||0)+q*P*7);
  const items=Object.entries(need).filter(([,q])=>q>0).map(([id,q])=>({id,used:q,packs:Math.max(1,Math.ceil(q-0.05)),d:ING[id]}));
  return {items,extras};
}
const sIdx=id=>STORES.findIndex(s=>s.id===id);
const unitPrice=(id,sid)=>ING[id][4][sIdx(sid)];
function priceAt(item,sid){const p=unitPrice(item.id,sid);return p==null?null:p*item.packs}
// Every combination of the user's stores; score = cost + (value of a stop) x extra stops.
function routes(items){
  const ids=S.shop.stores,out=[];
  for(let m=1;m<(1<<ids.length);m++){
    const set=ids.filter((_,i)=>m&(1<<i));
    if(S.shop.loyal&&!set.includes(S.shop.loyal))continue;
    let cost=0,ok=true;const assign={};
    for(const it of items){
      let best=null;for(const s of set){const p=priceAt(it,s);if(p!=null&&(best==null||p<best.p))best={s,p}}
      if(!best){ok=false;break}cost+=best.p;assign[it.id]=best.s;
    }
    if(!ok)continue;
    const used=[...new Set(Object.values(assign))];
    if(used.length<set.length)continue; // a store with nothing assigned is not a real stop
    out.push({set,cost,assign,stops:used.length,score:cost+S.shop.stopValue*(used.length-1)});
  }
  return out.sort((a,b)=>a.score-b.score);
}

const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');

async function saveFile(filename,text){
  try{
    if(window.claude&&window.claude.use){dlCap=dlCap===undefined?await window.claude.use('downloads'):dlCap;
      if(dlCap){await dlCap.save({filename,data:text});toast('Saved '+filename);return}}
  }catch(e){if(e&&e.code==='declined'){toast('Download cancelled');return}}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();
    toast('Downloaded '+filename+'. If nothing saved, use Copy.');
  }catch(e){toast('Download is blocked here; use Copy instead.')}
}

  if(p.goals.includes('muscle')){const w=p.members.filter(m=>m.weight);g.push(w.length?`Protein targets (0.9 to 1 g per lb): ${w.map(m=>`${m.name} ${Math.round(m.weight*0.9)} to ${m.weight} g a day`).join('; ')}. A standard dinner portion covers about ${avg('p')} g.`:`Aim for 0.9 to 1 g of protein per lb of body weight. Add weights in Profile for numbers.`)}
  if(p.goals.includes('lose'))g.push(`Dinners average about ${avg('kcal')} kcal per standard portion and lean on vegetables and protein, which keeps you full in a modest deficit.`);
  if(p.goals.includes('cheap'))g.push(`Clean 15 produce is priced conventional, so spending goes to the meat and Dirty Dozen items where organic matters.`);
  if(isBatch())g.push(`One cook session covers 6 dinners. Cooked food keeps 3 to 4 days in the fridge, so freeze the Thursday to Saturday portions and move each one to the fridge the night before.`);

function renderList(){
  if(!S.plan)buildPlan();
  const {items,extras}=groceries(),rs=routes(items),best=rs[0],sh=S.shop,P=portions();
  const controls=`<div class="card" style="display:grid;gap:14px">
    <p class="label" style="margin:0">How you like to shop</p>
    <div class="chips">${STORES.map(s=>`<label class="chip"><input type="checkbox" name="store" value="${s.id}" ${sh.stores.includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</div>
    <div class="fields">
      <div class="field"><label for="sv">An extra stop is worth it if it saves at least <span class="money" id="svv">${money(sh.stopValue)}</span></label><input id="sv" type="range" min="0" max="30" step="1" value="${sh.stopValue}"><div class="hint">$0 means cheapest at any cost; $30 means one stop.</div></div>
      <div class="field"><label for="loyal">Always include</label><select id="loyal"><option value="">No favourite store</option>${STORES.filter(s=>sh.stores.includes(s.id)).map(s=>`<option value="${s.id}" ${sh.loyal===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div></div>`;
  if(!best){
    $('#view-list').innerHTML=`<div><h2>Grocery list</h2></div>${controls}<div class="card"><p class="empty" style="margin:0">Your selected stores don't carry everything on this list. Add another store.</p></div>`;
    bindShop();return;
  }
  items.forEach(it=>it.store=best.assign[it.id]);
  const oneStop=rs.filter(r=>r.stops===1).sort((a,b)=>a.cost-b.cost)[0];
  const cheapest=[...rs].sort((a,b)=>a.cost-b.cost)[0];
  const bySize={};rs.forEach(r=>{if(!bySize[r.stops]||r.cost<bySize[r.stops].cost)bySize[r.stops]=r});
  const opts=Object.values(bySize).sort((a,b)=>a.stops-b.stops);
  const names=set=>set.map(id=>STORES[sIdx(id)].name).join(' + ');
  const bf=S.profile.breakfast?breakfast():null;
  const dinnerPortions=dinnerIds().reduce((s,id)=>s+recipePortions(id),0),bfPortions=bf?7*P:0,allPortions=dinnerPortions+bfPortions;
  const saved=oneStop?oneStop.cost-best.cost:null;
  const groups={};items.forEach(it=>{(groups[it.store]=groups[it.store]||[]).push(it)});
  const storeOrder=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  const LH=['Store','Aisle','Item','Quantity','Pack','How to buy'];

  // Price breakdown: what each meal uses (fractional) vs what you buy (whole packs).
  const usedCost=(id,q)=>q*unitPrice(id,best.assign[id]);
  const mealRows=dinnerIds().map((id,i)=>{const n=recipePortions(id);const c=rowsFor(id).filter(r=>r.id).reduce((s,r)=>s+usedCost(r.id,r.per*n),0);
    return {label:(isBatch()&&i<S.plan.length?'Batch '+'ABC'[i]+': ':(isBatch()?'Flex: ':''))+R(id).name,portions:n,cost:c}});
  if(bf)mealRows.push({label:'Breakfast: '+bf.name,portions:bfPortions,cost:Object.entries(bf.ing).reduce((s,[k,q])=>s+usedCost(k,q*P*7),0)});
  const usedTotal=mealRows.reduce((s,r)=>s+r.cost,0),left=best.cost-usedTotal;
  const pv=S.priceView;
  const priceBody=pv==='item'?`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Store</th><th class="num">Buy</th><th class="num">Each</th><th class="num">Total</th></tr></thead><tbody>
      ${[...items].sort((a,b)=>priceAt(b,b.store)-priceAt(a,a.store)).map(it=>`<tr><td>${esc(it.d[0])}</td><td>${esc(STORES[sIdx(it.store)].name)}</td><td class="num">${it.packs} × ${esc(it.d[2])}</td><td class="num">${money(unitPrice(it.id,it.store))}</td><td class="num">${money(priceAt(it,it.store))}</td></tr>`).join('')}
      <tr class="tot"><td colspan="4">Plan total</td><td class="num">${money(best.cost)}</td></tr></tbody></table></div>`
    :pv==='meal'?`<div class="tablewrap"><table><thead><tr><th>${isBatch()?'Batch or meal':'Meal'}</th><th class="num">Portions</th><th class="num">Cost</th><th class="num">Per portion</th></tr></thead><tbody>
      ${mealRows.map(r=>`<tr><td>${esc(r.label)}</td><td class="num">${portionsTxt(r.portions)}</td><td class="num">${money(r.cost)}</td><td class="num">${money(r.cost/r.portions)}</td></tr>`).join('')}
      <tr><td>Left over for next week (partly used packs)</td><td class="num"></td><td class="num">${money(left)}</td><td class="num"></td></tr>
      <tr class="tot"><td>Plan total</td><td class="num">${portionsTxt(allPortions)}</td><td class="num">${money(best.cost)}</td><td class="num">${money(best.cost/allPortions)}</td></tr></tbody></table></div>`
    :`<div class="summary">
        <div><b>${money(best.cost)}</b><span>bought this week</span></div>
        <div><b>${money(usedTotal)}</b><span>eaten this week</span></div>
        <div><b>${money(left)}</b><span>carried into next week</span></div>
        <div><b>${money(best.cost/7)}</b><span>per day for the household</span></div>
      </div>
      <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Store</th><th class="num">Items</th><th class="num">Subtotal</th></tr></thead><tbody>
      ${storeOrder.map(([sid,its])=>`<tr><td>${esc(STORES[sIdx(sid)].name)}</td><td class="num">${its.length}</td><td class="num">${money(its.reduce((s,it)=>s+priceAt(it,sid),0))}</td></tr>`).join('')}</tbody></table></div>`;

  $('#view-list').innerHTML=`
  <div><h2>Grocery list</h2><p class="lede">${items.length} items for ${isBatch()?`${S.plan.length} batch recipes covering 6 dinners${freshNight()?' and a fresh Sunday dinner':''}`:`${S.plan.length} dinners`}${bf?', plus 7 breakfasts':''}, sized for ${portionsTxt(P)} portions a meal.</p></div>
  <div class="card"><div class="summary">
    <div><b>${money(best.cost)}</b><span>estimated total</span></div>
    <div><b>${best.stops}</b><span>${best.stops===1?'stop':'stops'}: ${esc(names(best.set))}</span></div>
    <div><b>${money(best.cost/allPortions)}</b><span>per portion</span></div>
    <div><b>${saved!=null&&saved>0.005?money(saved):'—'}</b><span>${saved!=null&&saved>0.005?'saved vs best single store':oneStop?'already the best single store':'no single store has it all'}</span></div>
  </div></div>
  ${controls}
  <div class="card"><p class="label">Your options</p><div class="tablewrap"><table>
    <thead><tr><th>Stops</th><th>Where</th><th class="num">Total</th><th class="num">vs cheapest</th></tr></thead>
    <tbody>${opts.map(o=>`<tr class="${o===best?'pick':''}"><td>${o.stops}${o===best?' · Fare pick':''}</td><td>${esc(names(o.set))}</td><td class="num">${money(o.cost)}</td><td class="num">${o===cheapest?'cheapest':'+'+money(o.cost-cheapest.cost)}</td></tr>`).join('')}</tbody>
  </table></div></div>

  <div class="sechead"><h2>Shopping list</h2><div class="row"><button class="btn small primary" id="dl-all">Download full list</button><button class="btn small" id="cp-all">Copy</button></div></div>
  ${storeOrder.map(([sid,its])=>`<div class="card store"><div class="store-head"><h3>${esc(STORES[sIdx(sid)].name)}</h3><div class="row"><span class="learned">${its.length} items</span><button class="btn small" data-dlstore="${sid}">Download</button><button class="btn small" data-cpstore="${sid}">Copy</button></div></div>
    ${catOrder.filter(c=>its.some(it=>it.d[1]===c)).map(c=>`<div class="cat">${c}</div>`+its.filter(it=>it.d[1]===c).map(it=>{const ru=RULES[it.d[3]];return`
      <div class="item"><div class="nm">${esc(it.d[0])}<span class="qty">${it.packs} × ${esc(it.d[2])}</span></div>
      <div class="wh"><span class="rule ${ru.cls}">${ru.label}</span><span>${esc(ru.why)}</span></div></div>`}).join('')).join('')}
  </div>`).join('')}
  ${extras.length?`<div class="card store"><div class="store-head"><h3>Added by you</h3><span class="learned">Not priced yet</span></div>${extras.map(e=>`<div class="item"><div class="nm">${esc(e.name)}<span class="qty">${num(e.amt)} ${esc(e.unit)}</span></div><div class="wh"><span>For ${esc(e.recipe)}</span></div></div>`).join('')}</div>`:''}

  <div class="sechead"><h2>Price breakdown</h2><div class="seg" role="group" aria-label="Price breakdown level">${[['item','By item'],['meal',isBatch()?'By batch':'By meal'],['plan','Plan total']].map(([k,l])=>`<button class="btn small" data-pv="${k}" aria-pressed="${pv===k}">${l}</button>`).join('')}</div></div>
  <div class="card">${priceBody}
    <p class="hint" style="margin:12px 0 0">Estimates from illustrative prices. Meal costs count only what each recipe uses; the rest of a pack carries into next week. As you upload receipts, real prices replace these item by item, so you can see where the savings are.</p></div>
  <p class="learned">Assumes olive oil, salt and spices are in the pantry.</p>`;
  bindShop();
  const allIts=storeOrder.flatMap(([,its])=>its);
  const extraRows=extras.map(e=>['Any','Added by you',e.name,num(e.amt),e.unit,'For '+e.recipe]);
  $('#dl-all').onclick=()=>saveFile('fare-grocery-list.csv',toCSV([LH,...listRows(allIts),...extraRows]));
  $('#cp-all').onclick=()=>copyText(storeOrder.map(([sid,its])=>listText(STORES[sIdx(sid)].name.toUpperCase(),its)).join('\n\n')+(extras.length?'\n\nADDED BY YOU\n'+extras.map(e=>`- [ ] ${e.name}: ${num(e.amt)} ${e.unit}`).join('\n'):''));
  document.querySelectorAll('[data-dlstore]').forEach(b=>b.onclick=()=>{const sid=b.dataset.dlstore;saveFile('fare-'+slug(STORES[sIdx(sid)].name)+'.csv',toCSV([LH,...listRows(groups[sid])]))});
  document.querySelectorAll('[data-cpstore]').forEach(b=>b.onclick=()=>{const sid=b.dataset.cpstore;copyText(listText(STORES[sIdx(sid)].name.toUpperCase(),groups[sid]))});
  document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{S.priceView=b.dataset.pv;save();render()});
}
function bindShop(){
  document.querySelectorAll('input[name=store]').forEach(c=>c.onchange=()=>{
    S.shop.stores=[...document.querySelectorAll('input[name=store]:checked')].map(i=>i.value);
    if(!S.shop.stores.includes(S.shop.loyal))S.shop.loyal='';save();render();
  });
  const sv=$('#sv');sv.oninput=()=>{$('#svv').textContent=money(+sv.value)};sv.onchange=()=>{S.shop.stopValue=+sv.value;save();render()};
  $('#loyal').onchange=e=>{S.shop.loyal=e.target.value;save();render()};
}

function render(){
  ['profile','plan','list'].forEach(v=>{$('#view-'+v).hidden=v!==S.view;$('#tab-'+v).toggleAttribute('aria-current',false);if(v===S.view)$('#tab-'+v).setAttribute('aria-current','page')});
  ({profile:renderProfile,plan:renderPlan,list:renderList})[S.view]();
}
function go(v){S.view=v;save();render();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
const h=(location.hash||'').slice(1);if(['profile','plan','list'].includes(h))S.view=h;

// Feedback
function renderFb(){$('#fb-list').innerHTML=S.feedback.map(f=>`<li><b>${esc(f.screen)}</b>: ${esc(f.text)}</li>`).join('')}
$('#fb-toggle').onclick=()=>{const p=$('#fb');p.hidden=!p.hidden;$('#fb-toggle').setAttribute('aria-expanded',!p.hidden);if(!p.hidden)$('#fb-text').focus()};
$('#fb-save').onclick=()=>{const t=$('#fb-text').value.trim();if(!t)return;S.feedback.push({screen:S.view,text:t,at:new Date().toISOString()});$('#fb-text').value='';save();renderFb();$('#fb-msg').textContent='Saved'};
$('#fb-copy').onclick=()=>copyText(S.feedback.map(f=>`[${f.screen}] ${f.text}`).join('\n'));
renderFb();

async function boot(){
  try{
    const [cat,cfg]=await Promise.all(['data/catalog.json','data/config.json'].map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+': '+r.status);return r.json()}));
    ({STORES,RULES,ING,RECIPES,BREAKFASTS,ATTR,COOK}=cat);
    ({STYLES,COMPONENTS,PORTIONS,GOALS,GOAL_TAGS,RESTR}=cfg);
  }catch(e){
    $('#boot-msg').remove();
    $('#view-'+S.view).hidden=false;
    $('#view-'+S.view).innerHTML=`<div class="card"><p class="empty" style="margin:0">Couldn't load Fare's catalog (${esc(e.message)}). If you opened this file directly, serve it instead: <code>python3 -m http.server</code></p></div>`;
    return;
  }
  $('#boot-msg').remove();
  render();
}
boot();
</script>
</body>
</html>
